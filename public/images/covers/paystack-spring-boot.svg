<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Paystack payments in Spring Boot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0a2f2a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- card -->
  <g transform="translate(600 270)">
    <rect x="-170" y="-105" width="340" height="210" rx="20" fill="#1e293b" stroke="#10b981" stroke-width="5"/>
    <rect x="-170" y="-60" width="340" height="34" fill="#10b981"/>
    <rect x="-140" y="30" width="150" height="18" rx="9" fill="#334155"/>
    <circle cx="120" cy="45" r="26" fill="#0ea5e9" fill-opacity="0.7"/>
    <circle cx="90" cy="45" r="26" fill="#10b981" fill-opacity="0.7"/>
  </g>
  <g transform="translate(600 560)" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text font-size="46" font-weight="800">Paystack Payments</text>
    <text y="42" font-size="26" fill="#94a3b8">Accept Naira securely</text>
  </g>
  <g transform="translate(70 70)" fill="#10b981" font-family="Segoe UI, Arial, sans-serif">
    <text font-size="26" font-weight="700">⬢ StackFromZero</text>
  </g>
