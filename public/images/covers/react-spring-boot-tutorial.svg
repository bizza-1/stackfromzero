<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="React and Spring Boot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b2f22"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- React atom, left -->
  <g transform="translate(360 300)" stroke="#38bdf8" fill="none" stroke-width="6">
    <circle r="20" fill="#38bdf8" stroke="none"/>
    <ellipse rx="120" ry="46"/>
    <ellipse rx="120" ry="46" transform="rotate(60)"/>
    <ellipse rx="120" ry="46" transform="rotate(120)"/>
  </g>
  <!-- link -->
  <line x1="500" y1="300" x2="700" y2="300" stroke="#475569" stroke-width="5" stroke-dasharray="10 10"/>
  <!-- Spring leaf, right -->
  <g transform="translate(820 300)">
    <circle r="95" fill="none" stroke="#10b981" stroke-width="6"/>
    <path d="M-40 35 C-10 -55 55 -35 45 -50 C70 5 5 55 -40 35 Z" fill="#10b981"/>
  </g>
  <g transform="translate(600 560)" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text font-size="46" font-weight="800">React &amp; Spring Boot</text>
    <text y="42" font-size="26" fill="#94a3b8">Full-stack, from zero</text>
  </g>
  <g transform="translate(70 70)" fill="#10b981" font-family="Segoe UI, Arial, sans-serif">
    <text font-size="26" font-weight="700">⬢ StackFromZero</text>
  </g>
</svg>
