<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="React offline-first">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#082f2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <g transform="translate(600 330)" stroke="#38bdf8" fill="none" stroke-width="7">
    <circle r="26" fill="#38bdf8" stroke="none"/>
    <ellipse rx="150" ry="57"/>
    <ellipse rx="150" ry="57" transform="rotate(60)"/>
    <ellipse rx="150" ry="57" transform="rotate(120)"/>
  </g>
  <g transform="translate(600 560)" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text font-size="46" font-weight="800">Offline-First React</text>
    <text y="42" font-size="26" fill="#94a3b8">Works without internet</text>
  </g>
  <g transform="translate(70 70)" fill="#10b981" font-family="Segoe UI, Arial, sans-serif">
    <text font-size="26" font-weight="700">⬢ StackFromZero</text>
  </g>
</svg>
